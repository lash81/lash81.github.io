<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>Section Looper</title>
<meta name="description" content="Loop any section of a YouTube video. Drag the handles to pick a range; press play and it loops.">
<link rel="stylesheet" href="looper.css">
</head>
<body>
<main class="app">
  <header class="top">
    <h1>Section Looper</h1>
    <form id="loadForm" class="load" autocomplete="off">
      <input id="urlInput" type="text" inputmode="url" placeholder="Paste a YouTube link or video ID" aria-label="YouTube link">
      <button type="submit" id="loadBtn">Load</button>
    </form>
    <p id="status" class="status" role="status">Paste a link above to get started.</p>
  </header>

  <div class="player-wrap" id="playerWrap">
    <div id="player"></div>
  </div>

  <section class="controls" id="controls" hidden>
    <div class="track-labels">
      <span id="startLabel" class="time">0:00.0</span>
      <span id="nowLabel" class="time now">0:00.0</span>
      <span id="endLabel" class="time">0:00.0</span>
    </div>

    <div id="track" class="track" aria-label="Loop range">
      <div id="region" class="region">
        <div id="handleStart" class="handle handle-start" role="slider" aria-label="Loop start" tabindex="0"></div>
        <div id="handleEnd" class="handle handle-end" role="slider" aria-label="Loop end" tabindex="0"></div>
      </div>
      <div id="playhead" class="playhead"></div>
    </div>
    <p class="hint">Drag the ends to set the range, or drag the middle to slide the whole section.</p>

    <div class="transport">
      <button id="playBtn" class="primary" type="button" aria-label="Play">
        <svg id="iconPlay" viewBox="0 0 24 24" width="28" height="28"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
        <svg id="iconPause" viewBox="0 0 24 24" width="28" height="28" hidden><path fill="currentColor" d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
      </button>
      <button id="restartBtn" type="button" title="Jump to loop start">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <label class="speed">
        <span>Speed</span>
        <select id="speed">
          <option value="0.5">0.5×</option>
          <option value="0.75">0.75×</option>
          <option value="1" selected>1×</option>
          <option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option>
        </select>
      </label>
    </div>

    <div class="fine">
      <div class="fine-group">
        <span class="fine-title">Start</span>
        <div class="fine-row">
          <button type="button" data-edge="start" data-delta="-1">−1s</button>
          <button type="button" data-edge="start" data-delta="-0.1">−0.1</button>
          <input id="startInput" class="time-input" type="text" inputmode="decimal" aria-label="Loop start time">
          <button type="button" data-edge="start" data-delta="0.1">+0.1</button>
          <button type="button" data-edge="start" data-delta="1">+1s</button>
        </div>
      </div>
      <div class="fine-group">
        <span class="fine-title">End</span>
        <div class="fine-row">
          <button type="button" data-edge="end" data-delta="-1">−1s</button>
          <button type="button" data-edge="end" data-delta="-0.1">−0.1</button>
          <input id="endInput" class="time-input" type="text" inputmode="decimal" aria-label="Loop end time">
          <button type="button" data-edge="end" data-delta="0.1">+0.1</button>
          <button type="button" data-edge="end" data-delta="1">+1s</button>
        </div>
      </div>
    </div>

    <div class="share">
      <button id="shareBtn" type="button">Copy link to this loop</button>
      <span id="shareMsg" class="share-msg" aria-live="polite"></span>
    </div>
  </section>

  <footer class="foot">
    <a href="/">laurenshum.com</a>
  </footer>
</main>
<script src="looper.js"></script>
</body>
</html>
